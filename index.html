<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Resource Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
</head>
<body>
    <header>
        <h1>Campus Resource Finder</h1>
        <p>Find campus support services, live buses, and facility info</p>
    </header>

    <main>
        <aside>
            <label for="categoryFilter">Filter by Category:</label>
            <select id="categoryFilter">
                <option value="">All</option>
                <option value="Food">Food</option>
                <option value="Counseling">Counseling</option>
                <option value="Tutoring">Tutoring</option>
                <option value="Emergency Aid">Emergency Aid</option>
                <option value="Dining Hall">Dining Hall</option>
                <option value="Gym">Gym</option>
                <option value="Library">Library</option>
                <option value="Academic Building">Academic Building</option>
                <option value="Bus Stop">Bus Stop</option>
                <option value="Parking">Parking</option>
                <option value="Housing">Housing</option>
                <option value="Safety">Safety</option>
            </select>

            <label for="travelModeSelect">Travel Mode:</label>
            <select id="travelModeSelect">
                <option value="foot">🚶 Walking</option>
                <option value="bike">🚲 Biking</option>
                <option value="car">🚗 Driving</option>
            </select>

            <ul id="resourceList"></ul>
        </aside>

        <section id="map"></section>
    </main>

    <footer>
        <p>Made with ♥ at Texas A&M</p>
    </footer>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
